name: Build and Deploy to IIS (Self-Hosted)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_PATH: 'QDG.Migration.Web/QDG.Migration.Web.csproj'
  TARGET_PATH: 'D:\QDGPUBLISH'

jobs:
  build-and-deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}
        shell: cmd
      
      - name: Build project
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore
        shell: cmd
      
      - name: Publish project
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./publish
        shell: cmd
      
      - name: Deploy to IIS
        shell: powershell
        run: |
          try {
            Write-Host "Taking site offline..."
            $offlineFile = "${{ env.TARGET_PATH }}\app_offline.htm"
            "<html><body><h1>Site is updating... Please wait.</h1></body></html>" | Out-File -FilePath $offlineFile -Encoding UTF8
            
            Write-Host "Waiting for file locks to release..."
            Start-Sleep -Seconds 5
            
            Write-Host "Deploying files..."
            robocopy ./publish ${{ env.TARGET_PATH }} /E /XF app_offline.htm /NFL /NDL /NJH /NJS /nc /ns /np /W:3 /R:3
            
            if ($LASTEXITCODE -ge 8) {
              throw "Robocopy failed with exit code $LASTEXITCODE"
            }
            
            Write-Host "Deployment successful (Exit code: $LASTEXITCODE)"
            
            Write-Host "Bringing site back online..."
            Start-Sleep -Seconds 2
            Remove-Item -Path $offlineFile -Force
            
            Write-Host "Site is back online!"
          }
          catch {
            Write-Error "Deployment failed: $_"
            Remove-Item -Path "${{ env.TARGET_PATH }}\app_offline.htm" -Force -ErrorAction SilentlyContinue
            throw
          }
      
      - name: Verify Deployment
        shell: powershell
        run: |
          Write-Host "Verifying deployment..."
          Start-Sleep -Seconds 3
          
          try {
            $response = Invoke-WebRequest -Uri "http://localhost:8001" -UseBasicParsing -TimeoutSec 10
            Write-Host "SUCCESS: Site responded with status: $($response.StatusCode)"
          }
          catch {
            Write-Warning "Could not verify site: $($_.Exception.Message)"
          }
