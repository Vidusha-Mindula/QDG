name: Deploy to IIS

on:
  push:
    branches: [ main ]  # Change to your branch name
  workflow_dispatch:  # Allows manual trigger

jobs:
  deploy:
    runs-on: self-hosted  # Uses your self-hosted runner
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'  # Change to your .NET version (6.0.x, 7.0.x, etc.)
    
    - name: Restore dependencies
      run: dotnet restore QDG.Migration.Web/QDG.Migration.Web.csproj
    
    - name: Build
      run: dotnet build QDG.Migration.Web/QDG.Migration.Web.csproj --configuration Release --no-restore
    
    - name: Publish
      run: dotnet publish QDG.Migration.Web/QDG.Migration.Web.csproj --configuration Release --output D:\QDGPUBLISH_TEMP --no-build
    
    - name: Stop IIS Website
      run: |
        Import-Module WebAdministration
        Stop-WebSite -Name "QDGMigration"
      shell: powershell
    
    - name: Deploy to IIS
      run: |
        # Wait for IIS to release files
        Start-Sleep -Seconds 5
        
        # Remove old files (except for data/config you want to keep)
        Remove-Item -Path "D:\QDGPUBLISH\*" -Recurse -Force -Exclude "appsettings.Production.json","web.config"
        
        # Copy new files
        Copy-Item -Path "D:\QDGPUBLISH_TEMP\*" -Destination "D:\QDGPUBLISH\" -Recurse -Force
        
        # Clean up temp folder
        Remove-Item -Path "D:\QDGPUBLISH_TEMP" -Recurse -Force
      shell: powershell
    
    - name: Start IIS Website
      run: |
        Import-Module WebAdministration
        Start-WebSite -Name "QDGMigration"
      shell: powershell
    
    - name: Verify Deployment
      run: |
        Start-Sleep -Seconds 3
        $response = Invoke-WebRequest -Uri "http://localhost:8001" -UseBasicParsing
        if ($response.StatusCode -eq 200) {
          Write-Host "Deployment successful! Website is responding."
        } else {
          Write-Host "Warning: Website returned status code $($response.StatusCode)"
        }
      shell: powershell
