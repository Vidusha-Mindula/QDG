name: Build and Deploy to IIS (Self-Hosted)
on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  PROJECT_PATH: 'QDG.Migration.Web/QDG.Migration.Web.csproj'
  TARGET_PATH: 'D:\QDGPUBLISH'
  IIS_SITE_NAME: 'QDGMigration'

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Windows, x64, qdg-aus, qdg-main]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build project
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish project
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./publish

      - name: Deploy to IIS
        shell: powershell
        run: |
          Import-Module WebAdministration
          try {
            # Stop the IIS Website and App Pool
            Write-Host "Stopping IIS site '${{ env.IIS_SITE_NAME }}'..."
            Stop-WebAppPool -Name "${{ env.IIS_SITE_NAME }}" -ErrorAction Stop
            Stop-Website -Name "${{ env.IIS_SITE_NAME }}" -ErrorAction Stop
            
            Write-Host "Waiting for 5 seconds for services to stop..."
            Start-Sleep -Seconds 5
            
            Write-Host "Copying files from './publish' to '${{ env.TARGET_PATH }}'..."
            robocopy ./publish ${{ env.TARGET_PATH }} /E /PURGE /NFL /NDL /NJH /NJS /nc /ns /np /W:3
            
            if ($LastExitCode -ge 8) {
              Write-Error "Robocopy failed with exit code $LastExitCode"
              throw "Robocopy failed"
            }
            
            Write-Host "Robocopy successful (Exit code: $LastExitCode)."
            
          }
          finally {
            Write-Host "Starting IIS site '${{ env.IIS_SITE_NAME }}'..."
            Start-WebAppPool -Name "${{ env.IIS_SITE_NAME }}" -ErrorAction SilentlyContinue
            Start-Website -Name "${{ env.IIS_SITE_NAME }}" -ErrorAction SilentlyContinue
            Write-Host "Site restart attempted."
          }
          
          if ($Error) {
             Write-Error "Deployment failed. See errors above."
             exit 1 # Explicitly fail the step
          }
          
          Write-Host "Deployment complete."
          exit 0
