name: Deploy to IIS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    # REMOVE THIS STEP - .NET is already installed on the server
    # - name: Setup .NET
    #   uses: actions/setup-dotnet@v3
    #   with:
    #     dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore QDG.Migration.Web/QDG.Migration.Web.csproj
    
    - name: Build
      run: dotnet build QDG.Migration.Web/QDG.Migration.Web.csproj --configuration Release --no-restore
    
    - name: Publish
      run: dotnet publish QDG.Migration.Web/QDG.Migration.Web.csproj --configuration Release --output D:\QDGPUBLISH_TEMP --no-build
    
    - name: Stop IIS Website
      run: |
        Import-Module WebAdministration
        Stop-WebSite -Name "QDGMigration"
      shell: powershell
    
    - name: Deploy to IIS
      run: |
        Start-Sleep -Seconds 5
        Remove-Item -Path "D:\QDGPUBLISH\*" -Recurse -Force -ErrorAction SilentlyContinue
        Copy-Item -Path "D:\QDGPUBLISH_TEMP\*" -Destination "D:\QDGPUBLISH\" -Recurse -Force
        Remove-Item -Path "D:\QDGPUBLISH_TEMP" -Recurse -Force -ErrorAction SilentlyContinue
      shell: powershell
    
    - name: Start IIS Website
      run: |
        Import-Module WebAdministration
        Start-WebSite -Name "QDGMigration"
      shell: powershell
    
    - name: Verify Deployment
      run: |
        Start-Sleep -Seconds 3
        try {
          $response = Invoke-WebRequest -Uri "http://localhost:8001" -UseBasicParsing -TimeoutSec 10
          Write-Host "Deployment successful! Status: $($response.StatusCode)"
        } catch {
          Write-Host "Warning: Could not verify deployment - $($_.Exception.Message)"
        }
      shell: powershell
