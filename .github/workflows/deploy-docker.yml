name: Build and Deploy with Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CONTAINER_NAME: 'qdg-migration'
  IMAGE_NAME: 'qdg-migration-app'
  HOST_PORT: '8001'
  CONTAINER_PORT: '80'

jobs:
  build-and-deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Stop and remove old container
        shell: powershell
        run: |
          Write-Host "Stopping old container..."
          docker stop ${{ env.CONTAINER_NAME }} 2>$null
          docker rm ${{ env.CONTAINER_NAME }} 2>$null
          Write-Host "Old container removed (if existed)"
        continue-on-error: true
      
      - name: Build Docker image
        shell: cmd
        run: docker build -t ${{ env.IMAGE_NAME }}:latest .
      
      - name: Run Docker container
        shell: powershell
        run: |
          Write-Host "Starting new container..."
          docker run -d `
            --name ${{ env.CONTAINER_NAME }} `
            -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} `
            --restart unless-stopped `
            ${{ env.IMAGE_NAME }}:latest
          
          Write-Host "Container started successfully!"
      
      - name: Verify deployment
        shell: powershell
        run: |
          Write-Host "Waiting for container to start..."
          Start-Sleep -Seconds 5
          
          Write-Host "Checking container status..."
          docker ps -f name=${{ env.CONTAINER_NAME }}
          
          try {
            $response = Invoke-WebRequest -Uri "http://localhost:${{ env.HOST_PORT }}" -UseBasicParsing -TimeoutSec 10
            Write-Host "SUCCESS: Application is running! Status: $($response.StatusCode)"
          }
          catch {
            Write-Warning "Could not verify application: $($_.Exception.Message)"
            Write-Host "Container logs:"
            docker logs ${{ env.CONTAINER_NAME }} --tail 50
          }
      
      - name: Clean up old images
        shell: powershell
        run: |
          Write-Host "Cleaning up dangling images..."
          docker image prune -f
